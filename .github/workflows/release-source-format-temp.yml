name: CricLume P0-P3 source formatting (temporary)
on:
  push:
    branches:
      - fix/criclume-p0-p3-release-readiness-20261124
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install and format release readiness implementation
        run: |
          bun install --frozen-lockfile
          bunx prettier --write             src/lib/cloud.ts             src/lib/plans.ts             src/lib/release-readiness.ts             src/routes/'camera.$roomId.tsx'             src/components/plan/PlanGate.tsx             tests/plans.test.ts             tests/release-readiness.test.ts             tests/release-gate-cli.test.ts             tests/release-pilot-scenarios.test.ts             verification/release-gate.mjs
      - name: Commit formatted source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             src/lib/cloud.ts src/lib/plans.ts src/lib/release-readiness.ts             'src/routes/camera.$roomId.tsx'             src/components/plan/PlanGate.tsx             tests/plans.test.ts tests/release-readiness.test.ts             tests/release-gate-cli.test.ts tests/release-pilot-scenarios.test.ts             verification/release-gate.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(release): apply consistent formatting to P0-P3 changes'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
