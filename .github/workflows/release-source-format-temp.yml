name: CricLume P0-P3 source formatting (temporary)
on:
  push:
    branches:
      - fix/criclume-p0-p3-release-readiness-20261124
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install and format the full application without disabling lint
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            "src/**/*.{ts,tsx,js,mjs,cjs}" \
            "tests/**/*.{ts,tsx,js,mjs,cjs}" \
            "verification/**/*.{ts,tsx,js,mjs,cjs}" \
            "workers/**/*.{ts,tsx,js,mjs,cjs}" \
            "*.ts" "*.js"
      - name: Commit deterministic formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(P0): format all CricLume sources for strict repository lint'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
