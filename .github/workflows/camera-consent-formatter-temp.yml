name: CricLume camera consent formatter (temporary)
on:
  push:
    branches:
      - fix/criclume-camera-privacy-and-consent-20261121
permissions:
  contents: write
jobs:
  format-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed components
        run: |
          bunx prettier --write 'src/routes/camera.$roomId.tsx' src/lib/analysis-cloud.ts
      - name: Commit formatted source
        run: |
          if ! git diff --quiet -- 'src/routes/camera.$roomId.tsx' src/lib/analysis-cloud.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 'src/routes/camera.$roomId.tsx' src/lib/analysis-cloud.ts
            git commit -m 'style(camera): format consent and privacy integration'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
