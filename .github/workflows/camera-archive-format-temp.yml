name: CricLume archive migration and formatter (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-archive-object-check-20261121
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Generate migration with Supabase CLI and format implementation
        run: |
          bun install --frozen-lockfile
          supabase migration new --help >/dev/null
          if [ ! -f supabase/migrations/20261121220000_camera_cloud_archive_inspection.sql ]; then
            supabase migration new camera_cloud_archive_inspection
            generated="$(find supabase/migrations -maxdepth 1 -name '*_camera_cloud_archive_inspection.sql' | sort | tail -n 1)"
            test -n "$generated"
            mv "$generated" supabase/migrations/20261121220000_camera_cloud_archive_inspection.sql
            cp verification/camera-archive-migration-source.sql supabase/migrations/20261121220000_camera_cloud_archive_inspection.sql
          fi
          bunx prettier --write \
            src/lib/camera-archive-policy.ts \
            tests/camera-archive-policy.test.ts \
            'src/components/CameraCloudRecordingPanel.tsx' \
            src/lib/camera-cloud.ts \
            verification/analysis-database.mjs \
            supabase/functions/camera-cloud-archive/index.ts \
            supabase/functions/camera-cloud/index.ts \
            supabase/functions/integration-readiness/index.ts
      - name: Commit only expected generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20261121220000_camera_cloud_archive_inspection.sql \
            src/lib/camera-archive-policy.ts tests/camera-archive-policy.test.ts \
            src/components/CameraCloudRecordingPanel.tsx src/lib/camera-cloud.ts \
            verification/analysis-database.mjs \
            supabase/functions/camera-cloud-archive/index.ts \
            supabase/functions/camera-cloud/index.ts \
            supabase/functions/integration-readiness/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(camera): generate archive inspection migration and format integration'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
