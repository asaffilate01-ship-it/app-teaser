name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun audit --production

  database-lint:
    # Every job gets a distinct local project and listener ports. GitHub's
    # single-pending concurrency slot can otherwise cancel unrelated PR checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Prepare job-local Supabase configuration
        id: isolate
        run: python3 .github/scripts/isolate-local-supabase.py
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - name: Lint database functions and policies
        run: supabase db lint --local --level warning
      - name: Run database and RLS tests
        run: supabase test db
      - name: Stop isolated stack
        if: always() && steps.isolate.outcome == 'success'
        run: supabase stop --no-backup
