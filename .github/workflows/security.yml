name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun audit --production

  database-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,inbucket,logflare,vector,supavisor
      - name: Lint database functions and policies
        run: supabase db lint --local --level warning
      - name: Run database and RLS tests
        run: supabase test db
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
