name: CricLume automatic camera migration and format (temporary)
on:
  push:
    branches:
      - feat/criclume-auto-cloud-match-reconciler-20261121
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Format changed TypeScript and verification files
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            supabase/functions/_shared/camera-auto-policy.ts \
            supabase/functions/camera-cloud-auto/index.ts \
            supabase/functions/integration-readiness/index.ts \
            supabase/functions/camera-cloud/index.ts \
            src/lib/camera-cloud.ts \
            src/components/CameraCloudRecordingPanel.tsx \
            'src/routes/camera.$roomId.tsx' \
            tests/camera-cloud-auto-policy.test.ts \
            verification/analysis-database.mjs
      - name: Generate migration with Supabase CLI
        run: |
          if test ! -f supabase/migrations/20261121200000_cloud_camera_match_auto.sql; then
            supabase migration new cloud_camera_match_auto
            generated="$(find supabase/migrations -maxdepth 1 -name '*_cloud_camera_match_auto.sql' | sort | tail -n 1)"
            test -n "$generated"
            mv "$generated" supabase/migrations/20261121200000_cloud_camera_match_auto.sql
            cp verification/camera-cloud-auto-migration-source.sql supabase/migrations/20261121200000_cloud_camera_match_auto.sql
          fi
      - name: Commit generated migration and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20261121200000_cloud_camera_match_auto.sql \
            supabase/functions/_shared/camera-auto-policy.ts \
            supabase/functions/camera-cloud-auto/index.ts \
            supabase/functions/integration-readiness/index.ts \
            supabase/functions/camera-cloud/index.ts \
            src/lib/camera-cloud.ts \
            src/components/CameraCloudRecordingPanel.tsx \
            'src/routes/camera.$roomId.tsx' \
            tests/camera-cloud-auto-policy.test.ts \
            verification/analysis-database.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(camera): generate match auto migration and format source'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
