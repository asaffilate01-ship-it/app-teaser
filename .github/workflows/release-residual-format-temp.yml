name: CricLume final residual lint formatting (temporary)
on:
  push:
    branches:
      - fix/criclume-p0-p3-release-readiness-20261124
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Fix remaining Prettier drift without relaxing ESLint
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            public/sw-extras.js \
            src/components/league/AwardsBoard.tsx \
            src/components/leaguedesk/AuctionPanel.tsx \
            src/components/messages/TeamChat.tsx \
            src/components/training/TrainingHub.tsx \
            src/lib/club-office-cloud.ts \
            src/lib/members.functions.ts \
            src/lib/player-hub-cloud.ts
      - name: Commit formatting corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(P0): clean remaining service worker and Supabase query formatting'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
