name: Camera private import formatting (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-private-archive-import-20261121
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Generate Supabase migration and format integration
        run: |
          bun install --frozen-lockfile
          supabase migration new --help >/dev/null
          if [ ! -f supabase/migrations/20261121235000_camera_private_archive_import.sql ]; then
            supabase migration new camera_private_archive_import
            generated="$(find supabase/migrations -maxdepth 1 -name '*_camera_private_archive_import.sql' | sort | tail -n 1)"
            test -n "$generated"
            mv "$generated" supabase/migrations/20261121235000_camera_private_archive_import.sql
            cp verification/camera-private-import-migration-source.sql supabase/migrations/20261121235000_camera_private_archive_import.sql
          fi
          bunx prettier --write \
            src/lib/camera-import-policy.ts \
            tests/camera-import-policy.test.ts \
            'src/components/CameraImportApproval.tsx' \
            'src/components/CameraCloudRecordingPanel.tsx' \
            src/lib/camera-cloud.ts \
            verification/analysis-database.mjs \
            supabase/functions/camera-cloud-import-request/index.ts \
            supabase/functions/camera-cloud-import-worker/index.ts \
            supabase/functions/camera-cloud/index.ts \
            supabase/functions/integration-readiness/index.ts
      - name: Commit generated schema and formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20261121235000_camera_private_archive_import.sql \
            src/lib/camera-import-policy.ts \
            tests/camera-import-policy.test.ts \
            src/components/CameraImportApproval.tsx \
            src/components/CameraCloudRecordingPanel.tsx \
            src/lib/camera-cloud.ts \
            verification/analysis-database.mjs \
            supabase/functions/camera-cloud-import-request/index.ts \
            supabase/functions/camera-cloud-import-worker/index.ts \
            supabase/functions/camera-cloud/index.ts \
            supabase/functions/integration-readiness/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(camera): generate private import migration and format integration'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
