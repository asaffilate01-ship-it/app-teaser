name: CricLume cloud camera setup (temporary)
on:
  push:
    branches:
      - feat/criclume-cloud-camera-sfu-egress-20261121
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Install pinned LiveKit browser client and format changed sources
        run: |
          bun install --frozen-lockfile
          if ! grep -q '"livekit-client": "2.25.0"' package.json; then
            bun add --exact livekit-client@2.25.0
          fi
          bunx prettier --write \
            src/lib/camera-cloud.ts \
            src/lib/camera-cloud-status.ts \
            src/components/CameraCloudRecordingPanel.tsx \
            'src/routes/camera.$roomId.tsx' \
            'src/routes/director.$roomId.tsx' \
            tests/camera-cloud-status.test.ts \
            verification/analysis-database.mjs \
            supabase/functions/camera-cloud/index.ts \
            supabase/functions/camera-cloud-webhook/index.ts \
            supabase/functions/integration-readiness/index.ts
      - name: Generate ordered migration with Supabase CLI
        run: |
          if [ ! -f supabase/migrations/20261121190000_cloud_camera_egress.sql ]; then
            supabase migration new cloud_camera_egress
            generated="$(find supabase/migrations -maxdepth 1 -name '*_cloud_camera_egress.sql' | sort | tail -n 1)"
            test -n "$generated"
            mv "$generated" supabase/migrations/20261121190000_cloud_camera_egress.sql
            cp verification/cloud-camera-migration-source.sql supabase/migrations/20261121190000_cloud_camera_egress.sql
          fi
      - name: Commit generated migration, locked dependency, formatting
        run: |
          if ! git diff --quiet || git ls-files --others --exclude-standard | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json bun.lock \
              src/lib/camera-cloud.ts src/lib/camera-cloud-status.ts \
              src/components/CameraCloudRecordingPanel.tsx \
              'src/routes/camera.$roomId.tsx' 'src/routes/director.$roomId.tsx' \
              tests/camera-cloud-status.test.ts verification/analysis-database.mjs \
              supabase/functions/camera-cloud/index.ts \
              supabase/functions/camera-cloud-webhook/index.ts \
              supabase/functions/integration-readiness/index.ts \
              supabase/migrations/20261121190000_cloud_camera_egress.sql
            if ! git diff --cached --quiet; then
              git commit -m 'build(camera): lock LiveKit SDK and generate cloud egress migration'
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
