name: CricLume Phase 3 final formatter (temporary)

on:
  push:
    branches:
      - feat/criclume-budgeted-request-20261025
    paths:
      - .github/workflows/criclume-phase3-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write \
            src/lib/omniqora.ts \
            src/components/OmniqoraIntelligencePanel.tsx \
            supabase/functions/omniqora-intelligence/index.ts
      - name: Commit format-only changes
        shell: bash
        run: |
          if git diff --quiet -- src/lib/omniqora.ts src/components/OmniqoraIntelligencePanel.tsx supabase/functions/omniqora-intelligence/index.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/omniqora.ts src/components/OmniqoraIntelligencePanel.tsx supabase/functions/omniqora-intelligence/index.ts
          git commit -m "style(criclume): format verified Phase 3 client and dashboard"
          git push origin HEAD:feat/criclume-budgeted-request-20261025
