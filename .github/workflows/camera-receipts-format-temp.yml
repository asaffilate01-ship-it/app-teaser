name: CricLume receipts formatter (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-camera-command-receipts-20261121
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format recording command changes
        run: |
          bunx prettier --write \
            src/lib/camera-command-receipts.ts \
            tests/camera-command-receipts.test.ts \
            src/components/CameraCommandConfirmations.tsx \
            'src/routes/camera.$roomId.tsx' \
            'src/routes/director.$roomId.tsx'
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet -- \
            src/lib/camera-command-receipts.ts \
            tests/camera-command-receipts.test.ts \
            src/components/CameraCommandConfirmations.tsx \
            'src/routes/camera.$roomId.tsx' \
            'src/routes/director.$roomId.tsx'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/camera-command-receipts.ts tests/camera-command-receipts.test.ts \
              src/components/CameraCommandConfirmations.tsx \
              'src/routes/camera.$roomId.tsx' 'src/routes/director.$roomId.tsx'
            git commit -m 'style(camera): format P3 phone acknowledgments'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
