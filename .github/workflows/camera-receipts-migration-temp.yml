name: Create CricLume camera receipts migration (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-camera-command-receipts-20261121
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Generate migration with Supabase CLI
        run: |
          if test -f supabase/migrations/20261121173000_camera_command_receipts.sql; then
            echo 'Generated migration already exists.'
            exit 0
          fi
          supabase migration new --help >/dev/null
          supabase migration new camera_command_receipts
          generated="$(find supabase/migrations -maxdepth 1 -name '*_camera_command_receipts.sql' | sort | tail -n 1)"
          test -n "$generated"
          # Prior CricLume migrations have 11:30 and 14:20 suffixes on 21 Nov.
          # Preserve dependency order even when the CI runner uses UTC clock.
          mv "$generated" supabase/migrations/20261121173000_camera_command_receipts.sql
          cp verification/camera-command-receipts-source.sql supabase/migrations/20261121173000_camera_command_receipts.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20261121173000_camera_command_receipts.sql
          git commit -m 'feat(db): add camera receipt ledger migration'
          git push origin "HEAD:$GITHUB_REF_NAME"
