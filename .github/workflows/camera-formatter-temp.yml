name: CricLume camera formatter (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-multicamera-director-20261121
permissions:
  contents: write
jobs:
  format-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format only this feature
        run: |
          bunx prettier --write \
            src/lib/camera-live.ts \
            src/lib/camera-signals.ts \
            'src/routes/camera.$roomId.tsx' \
            'src/routes/director.$roomId.tsx' \
            src/routes/platform.tsx \
            tests/camera-signals.test.ts
      - name: Commit formatter fixes
        run: |
          if ! git diff --quiet -- \
            src/lib/camera-live.ts \
            src/lib/camera-signals.ts \
            'src/routes/camera.$roomId.tsx' \
            'src/routes/director.$roomId.tsx' \
            src/routes/platform.tsx \
            tests/camera-signals.test.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/camera-live.ts src/lib/camera-signals.ts \
              'src/routes/camera.$roomId.tsx' 'src/routes/director.$roomId.tsx' \
              src/routes/platform.tsx tests/camera-signals.test.ts
            git commit -m 'style(camera): format P3 live director and tests'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
