name: CricLume director format pass (temporary)
on:
  push:
    branches:
      - feat/criclume-p3-multicamera-director-20261121
permissions:
  contents: write
jobs:
  format-director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format director source
        run: bunx prettier --write 'src/routes/director.$roomId.tsx'
      - name: Push formatted source
        run: |
          if ! git diff --quiet -- 'src/routes/director.$roomId.tsx'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 'src/routes/director.$roomId.tsx'
            git commit -m 'style(camera): format director presence integration'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
