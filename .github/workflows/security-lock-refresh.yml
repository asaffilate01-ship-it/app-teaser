name: Refresh CricLume lockfile (temporary)
on:
  push:
    branches:
      - fix/criclume-scoring-and-release-gates-20261016
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already refreshed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "ci: regenerate aligned TanStack dependency lockfile"
          git push origin HEAD:fix/criclume-scoring-and-release-gates-20261016
      - run: bun audit --production
