name: Repair CricLume long media dependencies (temporary)
on:
  push:
    branches:
      - feat/criclume-large-media-stream-transfer-20261121
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin patched S3 SDK and regenerate isolated worker lock
        run: |
          npm pkg set --prefix workers/camera-long-transfer 'dependencies.@aws-sdk/client-s3=3.1175.0' 'dependencies.@aws-sdk/lib-storage=3.1175.0'
          npm install --prefix workers/camera-long-transfer --package-lock-only --ignore-scripts --no-fund
          npm ci --prefix workers/camera-long-transfer --omit=dev --ignore-scripts
          npm audit --prefix workers/camera-long-transfer --omit=dev --audit-level=high
          node --check workers/camera-long-transfer/index.mjs
          node workers/camera-long-transfer/index.mjs
      - name: Commit patched lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/camera-long-transfer/package.json
          git add -f workers/camera-long-transfer/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security(camera): patch AWS SDK vulnerabilities in isolated worker'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
