name: Generate CricLume privacy migration (temporary)
on:
  push:
    branches:
      - fix/criclume-camera-privacy-and-consent-20261121
permissions:
  contents: write
jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Generate timestamped migration using Supabase CLI
        run: |
          if compgen -G 'supabase/migrations/*_camera_media_privacy_gate.sql' >/dev/null; then
            echo "Migration already exists; no changes."
            exit 0
          fi
          supabase migration new --help > /dev/null
          supabase migration new camera_media_privacy_gate
          path="$(find supabase/migrations -maxdepth 1 -name '*_camera_media_privacy_gate.sql' | sort | tail -n 1)"
          test -n "$path"
          cp verification/camera-media-privacy-gate.sql "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'security(db): add generated camera media privacy migration'
          git push origin "HEAD:$GITHUB_REF_NAME"
