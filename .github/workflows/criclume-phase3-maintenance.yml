# Temporary maintenance workflow. Remove after lockfile and formatting pass.
name: CricLume Phase 3 dependency and source maintenance

on:
  push:
    branches:
      - feat/criclume-budgeted-request-20261025
    paths:
      - package.json
      - .github/workflows/criclume-phase3-maintenance.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh dependency lockfile
        run: bun install
      - name: Apply CricLume source formatter
        run: |
          bunx prettier --write \
            supabase/functions/_shared/omniqora-contract.ts \
            supabase/functions/omniqora-intelligence/index.ts \
            tests/omniqora-budgeted-flow.test.ts
      - name: Commit reviewed branch updates
        shell: bash
        run: |
          if git diff --quiet -- bun.lock supabase/functions/_shared/omniqora-contract.ts supabase/functions/omniqora-intelligence/index.ts tests/omniqora-budgeted-flow.test.ts; then
            echo "Lockfile and formatting are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock \
            supabase/functions/_shared/omniqora-contract.ts \
            supabase/functions/omniqora-intelligence/index.ts \
            tests/omniqora-budgeted-flow.test.ts
          git commit -m "ci: refresh patched dependencies and format CricLume Phase 3"
          git push origin HEAD:feat/criclume-budgeted-request-20261025
      - name: Verify production dependency audit
        run: bun audit --production
